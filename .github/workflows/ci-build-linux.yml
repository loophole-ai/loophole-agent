name: CI - Build - Linux

# The agent is cross-compiled: one Linux runner builds the CLI for every target
# and packages every VSIX target from that dist. Upstream Kilo's own publish
# workflow builds the VSIX on Linux too, so there is no per-OS split here.
#
# Same shape as the other Loophole repos: clone upstream at the pin, apply
# patches, build, upload.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions: {}

env:
  APP_NAME: Loophole
  BINARY_NAME: loophole
  ORG_NAME: loophole-ai
  GH_REPO_PATH: ${{ github.repository }}
  OS_NAME: linux

jobs:
  build-vsix:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Clone upstream Kilo
        run: bash ./get_repo.sh

      - name: Apply patches and assets
        run: bash ./prepare_src.sh

      # Building the Linux CLI targets needs Zig for the bundled Bubblewrap
      # sandbox helper.
      - name: Setup Zig for Linux sandbox helpers
        run: |
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          echo "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"

      - name: Build CLI and VSIX packages
        run: bash ./build.sh

      - name: Upload VSIX packages to gofile
        run: |
          cd kilo/packages/kilo-vscode/out
          ls -la
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "gofile server: $SERVER"
          : > links.md
          for f in *.vsix; do
            TARGET="${f#kilo-vscode-}"; TARGET="${TARGET%.vsix}"
            RESP=$(curl -s -F "file=@$f;filename=loophole-vscode-$TARGET.vsix" "https://$SERVER.gofile.io/contents/uploadfile")
            echo "$RESP" | jq .
            LINK=$(echo "$RESP" | jq -r '.data.downloadPage // empty')
            if [ -z "$LINK" ]; then echo "## gofile upload failed for $f" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
            echo "- **loophole-vscode-$TARGET.vsix**: $LINK" >> links.md
          done
          {
            echo "## Loophole VS Code extension (VSIX, per target)"
            echo ""
            cat links.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VSIX artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: loophole-vscode-vsix
          path: kilo/packages/kilo-vscode/out/*.vsix
          if-no-files-found: error
