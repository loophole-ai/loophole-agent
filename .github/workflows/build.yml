name: Build

# Test builds only: nothing here publishes or releases. VSIX packages go to gofile + a small artifact.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/**"
  workflow_dispatch:

jobs:
  build-vsix:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Prepare patched tree
        run: bash scripts/prepare-loophole.sh
        env:
          TARGET: ${{ github.workspace }}/loophole-build

      - name: Install dependencies
        run: cd loophole-build && bun install

      # The extension bundles a CLI binary per target, so build every CLI target first
      # (the same thing kilo's own publish flow does), then package a VSIX for each.
      # Building Linux targets needs Zig for the bundled Bubblewrap sandbox helper.
      - name: Setup Zig for Linux sandbox helpers
        run: |
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          echo "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"

      - name: Build CLI (all targets)
        run: cd loophole-build/packages/opencode && bun script/build.ts --skip-install

      - name: Build VSIX packages
        run: |
          cd loophole-build/packages/kilo-vscode
          bun script/build.ts
        env:
          CLI_DIST_DIR: ../../packages/opencode/dist

      - name: Upload VSIX packages to gofile
        run: |
          cd loophole-build/packages/kilo-vscode/out
          ls -la
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "gofile server: $SERVER"
          : > links.md
          for f in *.vsix; do
            TARGET="${f#kilo-vscode-}"; TARGET="${TARGET%.vsix}"
            RESP=$(curl -s -F "file=@$f;filename=loophole-vscode-$TARGET.vsix" "https://$SERVER.gofile.io/contents/uploadfile")
            echo "$RESP" | jq .
            LINK=$(echo "$RESP" | jq -r '.data.downloadPage // empty')
            if [ -z "$LINK" ]; then echo "## gofile upload failed for $f" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
            echo "- **loophole-vscode-$TARGET.vsix**: $LINK" >> links.md
          done
          {
            echo "## Loophole VS Code extension (VSIX, per target)"
            echo ""
            cat links.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VSIX artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: loophole-vscode-vsix
          path: loophole-build/packages/kilo-vscode/out/*.vsix
          if-no-files-found: error
